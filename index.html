<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kimo IPTV</title>
<style>
:root{
  --bg:#0f1117;--bg2:#161b27;--bg3:#1e2433;--panel:#1e2433;
  --line:#2a3347;--line2:#333f57;
  --text:#e8edf5;--muted:#7a8aaa;--muted2:#5a6880;
  --blue:#4f8ef7;--blue2:rgba(79,142,247,.15);--blue3:rgba(79,142,247,.08);
  --gold:#d4a843;--gold2:rgba(212,168,67,.12);
  --green:#2ecc71;--red:#e74c3c;--orange:#f39c12;--purple:#9b59b6;
  --live-clr:#e74c3c;--movie-clr:#4f8ef7;--series-clr:#9b59b6;
  --shadow:0 8px 32px rgba(0,0,0,.4);
  --rail:70px;--top:54px;--side-w:290px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;direction:rtl}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}

/* ══ APP SHELL ══ */
.app{height:100vh;display:grid;grid-template-rows:var(--top) 56px 1fr;overflow:hidden}

/* ══ TOPBAR ══ */
.qbar{background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:10;position:relative}
.qbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.35}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.brand-logo{width:34px;height:34px;background:linear-gradient(135deg,var(--gold),#e8c47a);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(212,168,67,.3)}
.brand-logo svg{width:20px;height:20px;color:#1a0e00}
.brand span{background:linear-gradient(90deg,var(--gold),#f0d080);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;animation:pdot 2.2s ease-in-out infinite;box-shadow:0 0 8px var(--green)}
@keyframes pdot{0%,100%{opacity:1;box-shadow:0 0 8px var(--green)}50%{opacity:.5;box-shadow:0 0 14px var(--green)}}
.qright{display:flex;align-items:center;gap:6px;direction:ltr}
.qpill{height:34px;border:1px solid var(--line2);border-radius:999px;background:var(--bg3);color:var(--muted);padding:0 12px;display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;transition:.18s;white-space:nowrap}
.qpill svg{width:14px;height:14px;flex-shrink:0}
.qpill:hover{border-color:var(--blue);color:var(--blue);background:var(--blue2)}
.qpill.active-radio{border-color:var(--green);color:var(--green);background:rgba(46,204,113,.1)}
.qpill:active{transform:scale(.95)}
.qpill .ptxt{display:inline}

/* ══ TOOLBAR ══ */
.toolbar{background:var(--bg2);border-bottom:1px solid var(--line);display:grid;grid-template-columns:var(--rail) 1fr auto;align-items:center;gap:10px;padding:0 16px 0 0;direction:ltr;z-index:8}
.tb-src{height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer;border-right:1px solid var(--line);transition:.18s}
.tb-src:hover{background:var(--bg3)}
.tb-src .ts-ico{width:30px;height:30px;border-radius:9px;background:var(--blue2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tb-src .ts-ico svg{width:16px;height:16px;color:var(--blue)}
.tb-src .ts-name{font-weight:700;font-size:13px;line-height:1.15;white-space:nowrap}
.tb-src .ts-sub{color:var(--muted);font-size:11px}
.search-wrap{flex:1;display:flex;align-items:center;background:var(--bg3);border:1px solid var(--line);border-radius:12px;height:38px;overflow:hidden;transition:.18s;margin:0 8px}
.search-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue2)}
.search-wrap svg{width:15px;height:15px;color:var(--muted);margin:0 10px;flex-shrink:0}
.search-wrap input{flex:1;background:none;border:0;outline:0;font-size:13px;color:var(--text)}
.search-wrap input::placeholder{color:var(--muted2)}
.search-wrap .kbd{background:var(--bg2);border:1px solid var(--line);border-radius:5px;font-size:10px;padding:2px 5px;color:var(--muted2);margin-left:8px;white-space:nowrap}
.tb-actions{display:flex;gap:4px}
.tico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.18s}
.tico:hover{background:var(--bg3);color:var(--blue)}
.tico svg{width:18px;height:18px}

/* ══ LAYOUT ══ */
.layout{display:grid;grid-template-columns:var(--rail) var(--side-w) 1fr;height:100%;min-height:0;overflow:hidden;direction:ltr}

/* ══ RAIL ══ */
.rail{background:var(--bg2);border-right:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.rbtn{width:54px;height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);transition:all .22s cubic-bezier(.34,1.56,.64,1);position:relative;margin:0 8px}
.rbtn svg{width:22px;height:22px;transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.rbtn .rl{font-size:8px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;line-height:1}
.rbtn:hover{background:var(--bg3);color:var(--text);transform:translateY(-3px)}
.rbtn:hover svg{transform:scale(1.1) translateY(-1px)}
.rbtn:active{transform:translateY(-1px) scale(.93)}
.rbtn.active{background:var(--blue2);color:var(--blue)}
.rbtn.active::before{content:'';position:absolute;left:-8px;width:3px;height:26px;background:var(--blue);border-radius:99px;box-shadow:0 0 8px rgba(79,142,247,.5)}
.rbtn.active svg{filter:drop-shadow(0 0 4px rgba(79,142,247,.5))}
.rail-div{width:30px;height:1px;background:var(--line);margin:4px 0;flex-shrink:0}

/* ══ SIDEBAR ══ */
.side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.side-hd{padding:14px 12px 10px;border-bottom:1px solid var(--line);flex-shrink:0}
.side-hd h3{font-size:14px;font-weight:800;color:var(--text)}
.side-hd .sh{color:var(--muted);font-size:11px;margin-top:1px}
.side-btns{display:flex;gap:5px;margin-top:10px}
.sbtn{flex:1;height:28px;border-radius:7px;background:var(--bg3);font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line);transition:.16s}
.sbtn:hover{background:var(--blue2);color:var(--blue);border-color:var(--blue)}
.sbtn svg{width:12px;height:12px}
.side-srch{padding:8px 10px;border-bottom:1px solid var(--line);flex-shrink:0}
.side-srch input{width:100%;height:30px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:12px;outline:0;transition:.16s}
.side-srch input:focus{border-color:var(--blue)}
.cat-wrap{flex:1;overflow-y:auto;padding:8px 8px}
.grp-hd{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted2);cursor:pointer;border-radius:7px;margin:4px 0 2px;user-select:none}
.grp-hd:hover{background:var(--bg3);color:var(--muted)}
.grp-hd .garr{width:13px;height:13px;transition:.18s}
.grp-hd.coll .garr{transform:rotate(-90deg)}
.grp-body{display:flex;flex-direction:column;gap:1px}
.grp-body.coll{display:none}
.cat{min-height:34px;display:flex;align-items:center;gap:7px;padding:0 8px;border-radius:9px;font-size:13px;cursor:pointer;transition:all .16s;position:relative}
.cat:hover{background:var(--bg3);padding-right:12px}
.cat.active{background:var(--blue2);color:var(--blue)}
.cat.active::before{content:'';position:absolute;right:0;width:2.5px;height:18px;background:var(--blue);border-radius:99px}
.cat .cn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .cact{display:flex;gap:3px;opacity:0;transition:.14s}
.cat:hover .cact{opacity:1}
.chide{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.chide:hover{background:rgba(231,76,60,.2);color:var(--red)}
.chide svg{width:11px;height:11px}
.badge{background:var(--bg3);color:var(--muted);border-radius:99px;padding:1px 7px;font-size:10.5px;font-weight:700;min-width:24px;text-align:center;flex-shrink:0}
.cat.active .badge{background:rgba(79,142,247,.25);color:var(--blue)}
.cat.hid-cat{opacity:.4}
.cat.hid-cat .cn{text-decoration:line-through}

/* ══ MAIN ══ */
.main{overflow-y:auto;padding:22px 24px 80px;direction:rtl}

/* ══ SECTION HEADS ══ */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.sec-hd h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec-hd .badge{font-size:11px}
.sec-hd a{font-size:12px;color:var(--muted);border-radius:99px;padding:4px 10px;transition:.16s}
.sec-hd a:hover{background:var(--blue2);color:var(--blue)}

/* ══ HERO ══ */
.hero{height:240px;border-radius:20px;overflow:hidden;position:relative;display:flex;align-items:flex-end;margin-bottom:26px;cursor:pointer}
.hero-bg{position:absolute;inset:0;background:var(--bg3);background-size:cover;background-position:center top;filter:blur(0px)}
.hero-ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.5) 50%,rgba(0,0,0,.1) 100%)}
.hero-body{position:relative;display:flex;gap:18px;padding:20px;align-items:flex-end;width:100%}
.hero-poster{width:120px;height:175px;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.2);box-shadow:0 8px 24px rgba(0,0,0,.5);flex-shrink:0}
.hero-info{flex:1}
.hero-info h1{font-size:26px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.7);margin-bottom:6px;color:#fff}
.hero-info .hgrp{font-size:12.5px;color:rgba(255,255,255,.65);margin-bottom:14px}
.play-cta{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;border-radius:12px;padding:10px 20px;font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(79,142,247,.4);transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.play-cta svg{width:16px;height:16px}
.play-cta:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 26px rgba(79,142,247,.5)}
.play-cta:active{transform:scale(.96)}

/* ══ ROWS ══ */
.rows{display:flex;flex-direction:column;gap:28px}
.scroller{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

/* ══ CARD ══ */
.card{width:155px;min-width:155px;cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.card:hover{transform:translateY(-5px)}
.card:active{transform:translateY(-2px) scale(.97)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:18px 14px}
.grid .card{width:auto;min-width:0}
.poster{height:225px;border-radius:12px;background:var(--bg3);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:.4s}
.card:hover .poster img{transform:scale(1.06)}
.pf{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:8px;padding:12px}
.pf svg{width:36px;height:36px;opacity:.4}
.pf .pf-nm{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.35;word-break:break-word}
.p-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,transparent 55%);opacity:0;transition:.25s}
.card:hover .p-ov{opacity:1}
.p-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.75);background:rgba(79,142,247,.9);border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.p-play svg{width:20px;height:20px;color:#fff;margin-left:3px}
.card:hover .p-play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.plbl{position:absolute;top:7px;right:7px;border-radius:5px;font-size:9px;padding:2px 6px;font-weight:800;letter-spacing:.4px}
.plbl.live{background:rgba(231,76,60,.9);color:#fff}
.plbl.movie{background:rgba(79,142,247,.9);color:#fff}
.plbl.series{background:rgba(155,89,182,.9);color:#fff}
.prat{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.75);color:#f1c40f;border-radius:5px;font-size:10.5px;padding:2px 6px;font-weight:800;display:flex;align-items:center;gap:2px}
.prat svg{width:10px;height:10px}
.pfav{position:absolute;bottom:7px;left:7px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:.18s;border:1px solid rgba(255,255,255,.15)}
.card:hover .pfav,.pfav.on{opacity:1}
.pfav.on{background:rgba(231,76,60,.8);border-color:transparent}
.pfav svg{width:13px;height:13px;color:#fff}
.card-ttl{font-size:12.5px;margin:8px 0 2px;font-weight:700;text-align:center;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ══ LIVE CARD ══ */
.lc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.lc:hover{background:var(--bg3);border-color:var(--blue);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.lc:active{transform:scale(.98)}
.lc-logo{width:48px;height:48px;border-radius:9px;object-fit:contain;background:var(--bg3);flex-shrink:0;border:1px solid var(--line)}
.lc-pf{width:48px;height:48px;border-radius:9px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lc-pf svg{width:24px;height:24px;color:var(--muted2)}
.lc-inf{flex:1;min-width:0}
.lc-nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-grp{font-size:11px;color:var(--muted);margin-top:2px}
.lc-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;animation:pdot 2s infinite;box-shadow:0 0 6px var(--red)}
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}

/* ══ WELCOME ══ */
.welcome{text-align:center;margin:60px auto;max-width:460px}
.welcome .big{font-size:60px;margin-bottom:14px}
.welcome h1{font-size:22px;color:var(--blue);margin-bottom:10px}
.welcome p{color:var(--muted);font-size:13.5px;line-height:1.7;margin-bottom:22px}
.btn-main{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;border-radius:12px;padding:12px 22px;font-weight:800;font-size:14px;box-shadow:0 8px 20px rgba(79,142,247,.3);transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(79,142,247,.4)}
.btn-main:active{transform:scale(.97)}
.btn-main svg{width:17px;height:17px}
.empty{display:flex;align-items:center;justify-content:center;height:280px;color:var(--muted);text-align:center}
.empty .ei{font-size:44px;margin-bottom:12px}

/* ══ MODAL ══ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px;backdrop-filter:blur(6px)}
.dialog{width:min(680px,96vw);max-height:88vh;overflow-y:auto;background:var(--bg2);border-radius:20px;border:1px solid var(--line2);box-shadow:0 40px 100px rgba(0,0,0,.6);direction:rtl;padding:22px}
.dialog h2{font-size:18px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:5px;margin-bottom:14px}
.tab{background:var(--bg3);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);transition:.16s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--blue);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(79,142,247,.3)}
.form{display:grid;gap:11px}
.form label{font-size:12.5px;font-weight:700;color:var(--muted)}
.form input,.form textarea,.form select{background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:13px;outline:0;width:100%;direction:ltr;transition:.16s;color:var(--text)}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue2)}
.form textarea{height:100px;resize:vertical}
.dact{display:flex;gap:8px;margin-top:14px}
.btn-out{border:1px solid var(--line2);border-radius:10px;padding:10px 18px;font-weight:700;font-size:13px;color:var(--muted);transition:.16s}
.btn-out:hover{border-color:var(--blue);color:var(--blue)}

/* ══ PLAYER ══ */
.player{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column}
.pt{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);flex-shrink:0}
.pt-title{font-weight:700;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;margin:0 12px}
.pt-close{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;transition:.16s;flex-shrink:0}
.pt-close:hover{background:rgba(231,76,60,.7)}
.pt-close svg{width:18px;height:18px;color:#fff}
.pv-wrap{flex:1;position:relative;overflow:hidden;background:#000}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.p-err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.7);gap:12px;text-align:center;padding:20px}
.p-err svg{width:48px;height:48px;opacity:.4}
.pb{height:58px;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;padding:0 16px}
.pb-btn{height:36px;border-radius:10px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);padding:0 14px;font-size:12.5px;font-weight:700;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:6px;transition:.16s;flex-shrink:0}
.pb-btn:hover{background:rgba(255,255,255,.16)}
.pb-btn svg{width:14px;height:14px}
.pb-btn.muted-on{color:var(--red);border-color:rgba(231,76,60,.4)}

/* ══ TOAST ══ */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--line2);color:var(--text);padding:11px 18px;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:200;font-size:13.5px;display:flex;align-items:center;gap:9px;animation:tin .28s ease;white-space:nowrap;max-width:90vw;direction:rtl}
.toast svg{width:16px;height:16px;flex-shrink:0}
.toast.ok svg{color:var(--green)}
.toast.er svg{color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ══ SETTINGS PAGE ══ */
.settings-pg{max-width:640px;direction:rtl}
.sg{background:var(--bg2);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.sg-hd{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sg-hd .sg-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sg-hd .sg-ico svg{width:18px;height:18px}
.sg-hd h3{font-size:14px;font-weight:800}
.sg-hd .sg-sub{font-size:11px;color:var(--muted);margin-top:1px}
.sg-body{padding:16px 18px;display:grid;gap:14px}
.sf{display:grid;gap:5px}
.sf label{font-size:12px;font-weight:700;color:var(--muted)}
.sf input,.sf select,.sf textarea{background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:13px;outline:0;color:var(--text);width:100%;transition:.16s;direction:ltr}
.sf input:focus,.sf select:focus,.sf textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue2)}
.sf .sf-row{display:flex;gap:8px;align-items:flex-end}
.sf .sf-row input{flex:1}
.sf-hint{font-size:11px;color:var(--muted2);margin-top:3px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:0;padding-bottom:0}
.tr-info .tr-nm{font-size:13px;font-weight:700}
.tr-info .tr-desc{font-size:11.5px;color:var(--muted);margin-top:2px}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.tslider{position:absolute;inset:0;background:var(--bg3);border-radius:99px;cursor:pointer;border:1px solid var(--line2);transition:.2s}
.tslider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:50%;transform:translateY(-50%);background:var(--muted);border-radius:50%;transition:.2s}
.toggle input:checked+.tslider{background:var(--blue);border-color:var(--blue)}
.toggle input:checked+.tslider::before{left:19px;background:#fff}
.btn-s{height:36px;border-radius:9px;background:var(--blue);color:#fff;padding:0 16px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.18s;white-space:nowrap}
.btn-s:hover{opacity:.88}
.btn-s svg{width:14px;height:14px}
.btn-s.danger{background:rgba(231,76,60,.15);color:var(--red);border:1px solid rgba(231,76,60,.3)}
.btn-s.danger:hover{background:var(--red);color:#fff}
.btn-s.outline{background:transparent;color:var(--muted);border:1px solid var(--line2)}
.btn-s.outline:hover{border-color:var(--blue);color:var(--blue)}
.sub-info{background:var(--bg3);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.si-row{display:flex;justify-content:space-between;font-size:12.5px}
.si-row .sk{color:var(--muted)}
.si-row .sv{font-weight:700}
.sv.ok{color:var(--green)}
.sv.er{color:var(--red)}
.sv.wr{color:var(--orange)}

/* ══ SOURCE CARD ══ */
.src-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;transition:.16s}
.src-card:hover{border-color:var(--blue)}
.src-ico{width:42px;height:42px;border-radius:11px;background:var(--blue2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.src-ico svg{width:22px;height:22px;color:var(--blue)}
.src-inf{flex:1}
.src-nm{font-weight:800;font-size:14px}
.src-mt{color:var(--muted);font-size:12px;margin-top:3px}
.src-acts{display:flex;gap:6px}
.sact{width:32px;height:32px;border-radius:9px;background:var(--bg3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:.16s}
.sact:hover{border-color:var(--blue)}
.sact.del:hover{background:rgba(231,76,60,.15);border-color:var(--red)}
.sact svg{width:15px;height:15px;color:var(--muted)}
.sact.del:hover svg{color:var(--red)}

/* ══ HIDDEN TAGS ══ */
.htag{display:inline-flex;align-items:center;gap:5px;background:rgba(231,76,60,.12);color:var(--red);border:1px solid rgba(231,76,60,.25);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700;cursor:pointer;transition:.14s}
.htag:hover{background:rgba(231,76,60,.22)}
.htag svg{width:11px;height:11px}

/* ══ RESPONSIVE ══ */
@media(max-width:960px){
  :root{--rail:54px;--side-w:260px;--top:48px}
  .toolbar{grid-template-columns:var(--rail) 1fr auto}
  .tb-src{display:none}
  .layout{grid-template-columns:var(--rail) 1fr}
  .side{position:fixed;top:calc(var(--top) + 56px);bottom:0;right:var(--rail);z-index:20;transform:translateX(110%);transition:.25s ease;box-shadow:var(--shadow)}
  .side.show{transform:translateX(0)}
  .main{padding:16px 14px 70px}
  .live-grid{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}
  .poster{height:185px}
  .card{width:135px;min-width:135px}
}
@media(max-width:540px){
  .rail{display:none}
  .layout{grid-template-columns:1fr}
  .side{right:0}
  .qpill .ptxt{display:none}
  .toolbar{grid-template-columns:1fr auto}
  .grid{grid-template-columns:repeat(2,1fr)}
  .poster{height:175px}
}
</style>

<script>
/* ═══════════════════════════════════════════════
   KIMO IPTV v3 — Full Engine
═══════════════════════════════════════════════ */
(()=>{"use strict";
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const LS="kimo3_", MK=LS+"meta";
const DEFAULT_RADIO="https://stream.radiojar.com/8s5u5tpdtwzuv";

/* ── STATE ── */
let S={
  view:"dashboard", items:[], favorites:[], recent:[],
  source:null, radioUrl:DEFAULT_RADIO, muted:false,
  query:"", activeCat:"All",
  hiddenCats:new Set(), selectedCats:new Set(),
  catSearchQ:"", catCollapsed:{},
  cfg:{
    // Player
    autoplay:true, defaultMuted:false, quality:"auto",
    hwAccel:true, bufferSize:30,
    // General
    language:"ar", dateFormat:"relative",
    cardSize:"medium", liveLayout:"grid",
    // EPG
    epgUrl:"", epgEnabled:false,
    // Parental
    parentalEnabled:false, parentalPin:"",
    // Network
    proxyUrl:"", userAgent:"",
    // Display
    showRatings:true, showLogos:true, animationsEnabled:true,
    showChannelNumbers:false,
    // Audio
    radioUrl:DEFAULT_RADIO,
  }
};
const radio=$("#radio"), video=$("#video");

/* ── LOAD/SAVE ── */
function save(){
  try{
    localStorage[MK]=JSON.stringify({
      favorites:S.favorites, recent:S.recent, source:S.source,
      radioUrl:S.radioUrl, muted:S.muted,
      hiddenCats:[...S.hiddenCats], catCollapsed:S.catCollapsed, cfg:S.cfg
    });
  }catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage[MK]||"{}");
    Object.assign(S, d);
    S.items=[];
    S.hiddenCats=new Set(d.hiddenCats||[]);
    S.selectedCats=new Set();
    S.catCollapsed=d.catCollapsed||{};
    S.cfg=Object.assign({...S.cfg}, d.cfg||{});
    S.radioUrl=S.cfg.radioUrl||DEFAULT_RADIO;
    radio.src=S.radioUrl;
  }catch(e){}
}

/* ── TOAST ── */
let toastT;
function toast(msg, type="ok"){
  const el=$("#toast"), tx=$("#toastTxt");
  el.className="toast "+type;
  const icons={ok:'<polyline points="20 6 9 17 4 12"/>',er:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r=".5" fill="currentColor"/>'};
  el.querySelector("svg").innerHTML=icons[type]||icons.ok;
  tx.textContent=msg;
  el.classList.remove("hidden");
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.add("hidden"),3000);
}

/* ── ESC / UTILS ── */
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function typeOf(it){
  if(it.type) return it.type;
  const g=it.group||"";
  if(/movie|film|cinema|افلام|أفلام|فيلم/i.test(g)) return "movie";
  if(/series|مسلسل|show|مسلسلات/i.test(g)) return "series";
  return "live";
}
const ARABIC=/[\u0600-\u06FF]/;
function isAr(s){return ARABIC.test(s||"")}
function sortCats(arr){
  return arr.sort((a,b)=>{
    if(a[0]==="All") return -1; if(b[0]==="All") return 1;
    const aA=isAr(a[0]), bA=isAr(b[0]);
    if(aA&&!bA) return -1; if(!aA&&bA) return 1;
    return a[0].localeCompare(b[0],"ar");
  });
}
function catsFor(kind){
  const arr=S.items.filter(i=>kind==="all"||typeOf(i)===kind);
  const m={All:arr.length};
  arr.forEach(i=>{const g=i.group||"Other";m[g]=(m[g]||0)+1});
  return sortCats(Object.entries(m));
}
function filtered(kind="all"){
  const q=S.query.trim().toLowerCase();
  const sel=[...S.selectedCats];
  return S.items.filter(i=>{
    if(kind!=="all"&&typeOf(i)!==kind) return false;
    const g=i.group||"Other";
    if(S.hiddenCats.has(g)) return false;
    if(sel.length){if(!sel.includes(g)&&!sel.includes("All")) return false}
    else if(S.activeCat!=="All"&&g!==S.activeCat) return false;
    if(q&&!i.name.toLowerCase().includes(q)&&!g.toLowerCase().includes(q)) return false;
    return true;
  });
}

/* ── POSTER/LOGO ── */
function svgIcon(type){
  const d={
    live:`<circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 7.76a6 6 0 0 0 0 8.49"/>`,
    movie:`<rect x="2" y="2" width="20" height="20" rx="2"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/>`,
    series:`<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3l-4 4-4-4"/><line x1="8" y1="13" x2="16" y2="13"/>`
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${d[type]||d.live}</svg>`;
}
function pf(name,type){return `<div class="pf">${svgIcon(type)}<div class="pf-nm">${esc(name)}</div></div>`}
function logoFb(type){return `<div class="lc-pf">${svgIcon(type)}</div>`}

function card(it){

  const lbl={live:"مباشر",movie:"فيلم",series:"مسلسل"}[t]||"";

  return `<div class="card" data-id="${esc(it.id)}">
    <div class="poster">
      ${S.cfg.showLogos&&it.logo
        ?`<img loading="lazy" src="${esc(it.logo)}" onerror="this.outerHTML='${pf(it.name,t).replace(/'/g,"&#39;")}'">` 
        :pf(it.name,t)}

      <div class="p-play"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>

function lc(it){
  return `<div class="lc" data-id="${esc(it.id)}">
    ${S.cfg.showLogos&&it.logo
      ?`<img class="lc-logo" loading="lazy" src="${esc(it.logo)}" onerror="this.outerHTML='${logoFb("live").replace(/'/g,"&#39;")}'">` 
      :logoFb("live")}
    <div class="lc-inf">
      <div class="lc-nm">${esc(it.name)}</div>
      <div class="lc-grp">${esc(it.group||"Live TV")}</div>
    </div>
    <div class="lc-dot"></div>

}
function cards(items, liveMode=false){
  if(!items.length) return `<div class="empty"><div><div class="ei">📭</div><div>لا توجد عناصر</div></div></div>`;
  if(liveMode) return `<div class="live-grid">${items.map(lc).join("")}</div>`;
  return `<div class="grid">${items.map(card).join("")}</div>`;
}

/* ── SIDEBAR ── */
function renderSide(kind="all", title="الفئات"){
  $("#sideTitle").textContent=title;
  const all=catsFor(kind);
  const q=(S.catSearchQ||"").toLowerCase();
  const arCats=[], otCats=[], allE=[];
  all.forEach(([n,c])=>{
    if(n==="All") allE.push([n,c]);
    else if(isAr(n)) arCats.push([n,c]);
    else otCats.push([n,c]);
  });
  let html=allE.map(([n,c])=>`
    <div class="cat ${S.activeCat===n&&!S.selectedCats.size?"active":""}" data-cat="${esc(n)}">
      <span class="cn">الكل</span><span class="badge">${c}</span>
    </div>`).join("");

  [{key:"ar",label:"العربية",cats:arCats},{key:"ot",label:"الأخرى",cats:otCats}].forEach(({key,label,cats:gc})=>{
    if(!gc.length) return;
    const vis=q?gc.filter(([n])=>n.toLowerCase().includes(q)):gc;
    if(!vis.length) return;
    const col=S.catCollapsed[key];
    html+=`<div class="cat-group">
      <div class="grp-hd ${col?"coll":""}" data-gk="${key}">
        <span>${label} <span style="opacity:.5;font-size:9px">(${gc.length})</span></span>
        <svg class="garr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="grp-body ${col?"coll":""}">
        ${vis.map(([n,c])=>{
          const hid=S.hiddenCats.has(n), sel=S.selectedCats.has(n);
          const act=(S.activeCat===n&&!S.selectedCats.size)||sel;
          return `<div class="cat ${act?"active":""} ${hid?"hid-cat":""}" data-cat="${esc(n)}">
            <span class="cn">${esc(n)}</span>
            <div class="cact">
              <button class="chide" data-hc="${esc(n)}" title="${hid?"إظهار":"إخفاء"}">
                ${hid?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
                     :`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`}
              </button>
            </div>
            <span class="badge">${c}</span>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  });
  $("#catList").innerHTML=html;
  bindSide();
}
function bindSide(){
  $$("#catList .cat").forEach(el=>{
    el.onclick=e=>{
      if(e.target.closest(".chide")) return;
      const n=el.dataset.cat;
      if(e.shiftKey||e.ctrlKey){
        S.selectedCats[S.selectedCats.has(n)?"delete":"add"](n);
        S.activeCat="All";
      } else { S.selectedCats.clear(); S.activeCat=n; }
      render();
    };
  });
  $$("#catList .chide").forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const n=btn.dataset.hc;
      S.hiddenCats[S.hiddenCats.has(n)?"delete":"add"](n);
      save();
      const k=S.view==="movies"?"movie":S.view==="series"?"series":S.view==="live"?"live":"all";
      renderSide(k,$("#sideTitle").textContent);
      renderMain();
    };
  });
  $$("#catList .grp-hd").forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.gk;
      S.catCollapsed[k]=!S.catCollapsed[k]; save();
      el.classList.toggle("coll"); el.nextElementSibling.classList.toggle("coll");
    };
  });
}

/* ── VIEWS ── */
function setView(v){S.view=v;S.activeCat="All";S.selectedCats.clear();$$(".rbtn").forEach(b=>b.classList.toggle("active",b.dataset.view===v));render()}
function updateTop(){
  $("#srcName").textContent=(S.source&&S.source.name)||"Kimo IPTV";
  $("#srcType").textContent=S.source?`${S.source.type} · ${S.items.length} عنصر`:"لا يوجد مصدر";
}
function renderMain(){
  const v=S.view;
  if(v==="dashboard") vDash();
  else if(v==="sources") vSources();
  else if(v==="favorites") vFav();
  else if(v==="recent") vRecent();
  else if(v==="movies") vList("movie","الأفلام");
  else if(v==="live") vList("live","البث المباشر",true);
  else if(v==="series") vList("series","المسلسلات");
  else if(v==="search") vSearch();
  else vSettings();
  bindCards();
}
function render(){
  updateTop();
  $("#side").classList.remove("show");
  const k=S.view==="movies"?"movie":S.view==="series"?"series":S.view==="live"?"live":"all";
  const t={dashboard:"الرئيسية",live:"فئات المباشر",movies:"فئات الأفلام",series:"فئات المسلسلات",favorites:"الفئات",recent:"الفئات",search:"الفئات",sources:"الفئات",settings:"الفئات"}[S.view]||"الفئات";
  renderSide(k,t);
  renderMain();
}

/* ── BIND CARDS ── */
function bindCards(){
  $$("#main .card, #main .hero, #main .play-cta, #main .lc").forEach(el=>{
    if(el.classList.contains("play-cta")||el.classList.contains("hero")||el.classList.contains("card")||el.classList.contains("lc")){
      el.onclick=e=>{
        if(e.target.closest(".pfav")) return;
        var tmp=el.querySelector("[data-id]");var id=el.dataset.id||(tmp&&tmp.dataset.id);
        if(id) play(id);
      };
    }
  });
  $$("#main .pfav").forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();
    const id=btn.dataset.fid;
    if(S.favorites.includes(id)) S.favorites=S.favorites.filter(x=>x!==id);
    else S.favorites.unshift(id);
    save();
    btn.classList.toggle("on",S.favorites.includes(id));
    btn.querySelector("svg").setAttribute("fill",S.favorites.includes(id)?"currentColor":"none");
  });
}

/* ── PLAYER ── */
let hlsInst=null;
function loadHLS(url){
  if(typeof Hls==="undefined") return false;
  if(!Hls.isSupported()) return false;
  if(hlsInst){hlsInst.destroy();hlsInst=null;}
  hlsInst=new Hls({
    maxBufferLength:S.cfg.bufferSize||30,
    enableWorker:true,
    lowLatencyMode:true
  });
  hlsInst.loadSource(url);
  hlsInst.attachMedia(video);
  hlsInst.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
  hlsInst.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){showPErr("خطأ HLS: "+d.details);}});
  return true;
}
function showPErr(msg){
  $("#perr").classList.remove("hidden");
  $("#perrMsg").textContent=msg||"تعذر التشغيل";
}
function hidePErr(){$("#perr").classList.add("hidden")}

function play(id){
  if(!id) return;
  const it=S.items.find(x=>x.id===id);
  if(!it){toast("لم يُعثر على العنصر","er");return}
  if(!it.url){toast("لا يوجد رابط تشغيل","er");return}

  hidePErr();
  $("#playerTitle").textContent=it.name;
  const t=typeOf(it);
  $("#pt-type").textContent={live:"🔴 مباشر",movie:"🎬 فيلم",series:"📺 مسلسل"}[t]||"";

  const url=it.url;
  const isHLS=/\.(m3u8)/i.test(url)||url.includes("/live/")||url.includes("/m3u8");

  // Destroy any previous HLS
  if(hlsInst){hlsInst.destroy();hlsInst=null;}
  video.removeAttribute("src");
  video.load();

  const doNative=()=>{
    video.src=url;
    video.muted=S.muted||S.cfg.defaultMuted;
    video.play().then(()=>hidePErr()).catch(err=>{
      // If native fails on HLS, try HLS.js
      if(isHLS){
        const loaded=loadHLS(url);
        if(!loaded) showPErr("المتصفح لا يدعم هذا الرابط");
      } else {
        showPErr("تعذر التشغيل: "+err.message);
      }
    });
  };

  if(isHLS && typeof Hls!=="undefined" && Hls.isSupported()){
    loadHLS(url);
  } else if(video.canPlayType("application/vnd.apple.mpegurl")){
    doNative(); // Safari native HLS
  } else {
    doNative();
  }

  $("#player").classList.remove("hidden");
  S.recent=[it.id,...S.recent.filter(x=>x!==it.id)].slice(0,50);
  save();
}

function closePlayer(){
  $("#player").classList.add("hidden");
  if(hlsInst){hlsInst.destroy();hlsInst=null;}
  video.pause();
  video.removeAttribute("src");
  video.load();
  hidePErr();
}

video.addEventListener("error",()=>{
  if(video.src&&video.src!==location.href){
    showPErr("تعذر تشغيل المحتوى — قد يكون الرابط منتهياً أو محمياً");
  }
});

/* ── NETWORK ── */
const IS_LOCAL=location.protocol==="file:"||["127.0.0.1","localhost"].includes(location.hostname);
function proxyU(url){
  const px=S.cfg.proxyUrl||"";
  if(px&&/^https?:\/\//i.test(url)) return px+encodeURIComponent(url);
  if(IS_LOCAL&&/^https?:\/\//i.test(url)) return "http://127.0.0.1:8787/proxy?url="+encodeURIComponent(url);
  return url;
}
async function sfetch(url,as="text"){
  const headers={};
  if(S.cfg.userAgent) headers["User-Agent"]=S.cfg.userAgent;
  let r;
  try{r=await fetch(proxyU(url),{cache:"no-store",headers})}
  catch(e){throw Error("فشل الاتصال. "+(IS_LOCAL?"شغّل الخادم المحلي أولاً.":"تأكد من الاتصال.")+"\n"+e.message)}
  if(!r.ok){let t="";try{t=await r.text()}catch(_){}throw Error("Server "+r.status+(t?" - "+t.slice(0,140):""))}
  return as==="json"?r.json():r.text();
}
async function loadM3U(url){if(!url)throw Error("ضع رابط M3U");return parseM3U(await sfetch(url))}
async function xtJson(b,a){return sfetch(b+(a?"&action="+a:""),"json")}
function catMap(arr){const m={};(Array.isArray(arr)?arr:[]).forEach(c=>m[String(c.category_id)]=c.category_name||c.name||"");return m}
async function loadXtream(server,user,pass){
  server=(server||"").trim().replace(/\/$/,"");
  if(!server||!user||!pass)throw Error("اكتب Server URL و Username و Password");
  if(!/^https?:\/\//i.test(server))server="http://"+server;
  const u=encodeURIComponent(user),pw=encodeURIComponent(pass);
  const base=`${server}/player_api.php?username=${u}&password=${pw}`;
  const auth=await xtJson(base,"");
  if((auth&&auth.user_info&&auth.user_info.auth)===0)throw Error("بيانات الاشتراك غير صحيحة");
  let out=[];
  try{
    const [lc2,mc,sc,live,vod,series]=await Promise.all([
      xtJson(base,"get_live_categories").catch(()=>[]),
      xtJson(base,"get_vod_categories").catch(()=>[]),
      xtJson(base,"get_series_categories").catch(()=>[]),
      xtJson(base,"get_live_streams").catch(e=>({__e:e.message})),
      xtJson(base,"get_vod_streams").catch(e=>({__e:e.message})),
      xtJson(base,"get_series").catch(e=>({__e:e.message}))
    ]);
    const lm=catMap(lc2),mm=catMap(mc),sm=catMap(sc);
    if(Array.isArray(live))live.forEach(x=>out.push({id:"l_"+x.stream_id,name:x.name||"Live",group:lm[x.category_id]||"Live TV",logo:x.stream_icon||"",url:`${server}/live/${u}/${pw}/${x.stream_id}.m3u8`,type:"live"}));
    if(Array.isArray(vod))vod.forEach(x=>out.push({id:"m_"+x.stream_id,name:x.name||"Movie",group:mm[x.category_id]||"Movies",logo:x.stream_icon||x.cover||"",url:`${server}/movie/${u}/${pw}/${x.stream_id}.${x.container_extension||"mp4"}`,type:"movie",rating:x.rating}));
    if(Array.isArray(series))series.forEach(x=>out.push({id:"s_"+x.series_id,name:x.name||"Series",group:sm[x.category_id]||"Series",logo:x.cover||"",url:"",type:"series",rating:x.rating}));
  }catch(e){}
  if(!out.length){try{out=parseM3U(await sfetch(`${server}/get.php?username=${u}&password=${pw}&type=m3u_plus&output=m3u8`))}catch(e){throw Error("تعذر التحميل (CORS). جرب رابط M3U مباشرة.\n"+e.message)}}
  if(!out.length)throw Error("تم الاتصال لكن لم يُعثر على قنوات.");
  return out.map(x=>({id:x.id,name:x.name||"",group:x.group||"Other",logo:x.logo||"",url:x.url||"",type:x.type||"live",rating:x.rating||""}));
}
function parseM3U(txt){
  const lines=txt.split(/\r?\n/), out=[];
  for(let i=0;i<lines.length;i++){
    const l=lines[i].trim();
    if(!l.startsWith("#EXTINF")) continue;
    const name=(l.split(",").pop()||"Channel").trim();
    const attrs={};
    l.replace(/([\w-]+)="([^"]*)"/g,(_,k,v)=>attrs[k]=v);
    let url="";
    while(++i<lines.length){url=lines[i].trim();if(url&&!url.startsWith("#"))break}
    if(!url) continue;
    const g=attrs["group-title"]||"Other";
    out.push({
      id:"m_"+out.length+"_"+Date.now(),
      name:attrs["tvg-name"]||name,
      group:g, logo:attrs["tvg-logo"]||"", url,
      type:/movie|افلام|أفلام|فيلم/i.test(g)?"movie":/series|مسلسل|مسلسلات/i.test(g)?"series":"live"
    });
  }
  return out;
}
